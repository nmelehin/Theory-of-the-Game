<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a0c0c"/>
      <stop offset="16%" stop-color="#c62828"/>
      <stop offset="33%" stop-color="#e8735a"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="67%" stop-color="#6f9fd8"/>
      <stop offset="84%" stop-color="#1e4e8c"/>
      <stop offset="100%" stop-color="#101f3c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1260" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-size="30" font-weight="bold" fill="#1a1a1a">Политический спектр: карта взглядов и идеологий</text>
  <text x="800" y="90" text-anchor="middle" font-size="16" fill="#666666">Общепринятое разделение политических позиций — от рассадки депутатов 1789 года до современного «политического компаса»</text>

  <!-- ================= Section 1: linear spectrum ================= -->
  <text x="120" y="152" font-size="20" font-weight="bold" fill="#1a1a1a">1. Классическая одномерная шкала «лево — право»</text>

  <rect x="120" y="180" width="1360" height="44" rx="8" fill="url(#spectrum)"/>
  <!-- zone ticks -->
  <line x1="314" y1="180" x2="314" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="509" y1="180" x2="509" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="703" y1="180" x2="703" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="897" y1="180" x2="897" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="1091" y1="180" x2="1091" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="1286" y1="180" x2="1286" y2="236" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- zone labels -->
  <text x="217" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a0c0c">Крайне левые</text>
  <text x="217" y="284" text-anchor="middle" font-size="13" fill="#777777">коммунизм, анархизм</text>
  <text x="411" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#b02525">Левые</text>
  <text x="411" y="284" text-anchor="middle" font-size="13" fill="#777777">социализм</text>
  <text x="606" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05540">Левоцентристы</text>
  <text x="606" y="284" text-anchor="middle" font-size="13" fill="#777777">соц.-демократия, «зелёные»</text>
  <text x="800" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#555555">Центр</text>
  <text x="800" y="284" text-anchor="middle" font-size="13" fill="#777777">либерализм</text>
  <text x="994" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b6ba5">Правоцентристы</text>
  <text x="994" y="284" text-anchor="middle" font-size="13" fill="#777777">христ.-демократия</text>
  <text x="1189" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e4e8c">Правые</text>
  <text x="1189" y="284" text-anchor="middle" font-size="13" fill="#777777">консерватизм</text>
  <text x="1383" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#101f3c">Крайне правые</text>
  <text x="1383" y="284" text-anchor="middle" font-size="13" fill="#777777">фашизм</text>

  <text x="120" y="322" font-size="14" fill="#555555">Левые — за равенство, перераспределение и перемены; правые — за традиции, порядок и свободный рынок (критерий Н. Боббио, 1994).</text>

  <!-- ================= Section 2: political compass ================= -->
  <text x="120" y="392" font-size="20" font-weight="bold" fill="#1a1a1a">2. Политический компас: двумерная модель</text>

  <!-- axis end labels -->
  <text x="560" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">АВТОРИТАРИЗМ — сильная власть государства</text>
  <text x="560" y="1138" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">ЛИБЕРТАРИАНСТВО — личная свобода</text>
  <text x="207" y="780" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" transform="rotate(-90 207 780)">ЛЕВАЯ ЭКОНОМИКА — равенство, регулирование</text>
  <text x="915" y="780" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" transform="rotate(90 915 780)">ПРАВАЯ ЭКОНОМИКА — свободный рынок</text>

  <!-- quadrants -->
  <rect x="230" y="450" width="330" height="330" fill="#f7d4d4"/>
  <rect x="560" y="450" width="330" height="330" fill="#d3ddf2"/>
  <rect x="230" y="780" width="330" height="330" fill="#d7ecd7"/>
  <rect x="560" y="780" width="330" height="330" fill="#f6ecc8"/>
  <rect x="230" y="450" width="660" height="660" fill="none" stroke="#999999" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="560" y1="450" x2="560" y2="1110" stroke="#555555" stroke-width="2"/>
  <line x1="230" y1="780" x2="890" y2="780" stroke="#555555" stroke-width="2"/>

  <!-- quadrant names -->
  <text x="244" y="474" font-size="14" font-weight="bold" fill="#8c2f2f" opacity="0.85">АВТОРИТАРНЫЕ ЛЕВЫЕ</text>
  <text x="876" y="474" text-anchor="end" font-size="14" font-weight="bold" fill="#2c3e6b" opacity="0.85">АВТОРИТАРНЫЕ ПРАВЫЕ</text>
  <text x="244" y="1096" font-size="14" font-weight="bold" fill="#2e6b2e" opacity="0.85">ЛИБЕРТАРНЫЕ ЛЕВЫЕ</text>
  <text x="876" y="1096" text-anchor="end" font-size="14" font-weight="bold" fill="#8a6d1a" opacity="0.85">ЛИБЕРТАРНЫЕ ПРАВЫЕ</text>

  <!-- points: authoritarian left -->
  <circle cx="313" cy="500" r="13" fill="#c0392b"/>
  <text x="313" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="379" cy="566" r="13" fill="#c0392b"/>
  <text x="379" y="571" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <!-- points: authoritarian right -->
  <circle cx="659" cy="483" r="13" fill="#283593"/>
  <text x="659" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="808" cy="533" r="13" fill="#283593"/>
  <text x="808" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <circle cx="758" cy="714" r="13" fill="#283593"/>
  <text x="758" y="719" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <!-- points: libertarian left -->
  <circle cx="461" cy="830" r="13" fill="#2e7d32"/>
  <text x="461" y="835" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <circle cx="395" cy="879" r="13" fill="#2e7d32"/>
  <text x="395" y="884" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7</text>
  <circle cx="280" cy="1060" r="13" fill="#2e7d32"/>
  <text x="280" y="1065" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8</text>
  <!-- points: libertarian right -->
  <circle cx="791" cy="1028" r="13" fill="#b8860b"/>
  <text x="791" y="1033" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">9</text>

  <!-- ================= Legend (right side) ================= -->
  <text x="960" y="470" font-size="18" font-weight="bold" fill="#1a1a1a">Исторические примеры на компасе</text>

  <circle cx="972" cy="503" r="11" fill="#c0392b"/><text x="972" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="994" y="500" font-size="15" font-weight="bold" fill="#222222">СССР при Сталине (1924–1953)</text>
  <text x="994" y="519" font-size="13" fill="#777777">плановая экономика, тоталитарный контроль</text>

  <circle cx="972" cy="555" r="11" fill="#c0392b"/><text x="972" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="994" y="552" font-size="15" font-weight="bold" fill="#222222">Китай при Мао (1949–1976)</text>
  <text x="994" y="571" font-size="13" fill="#777777">«большой скачок», культурная революция</text>

  <circle cx="972" cy="607" r="11" fill="#283593"/><text x="972" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="994" y="604" font-size="15" font-weight="bold" fill="#222222">Нацистская Германия (1933–1945)</text>
  <text x="994" y="623" font-size="13" fill="#777777">ультранационализм, культ вождя, террор</text>

  <circle cx="972" cy="659" r="11" fill="#283593"/><text x="972" y="664" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="994" y="656" font-size="15" font-weight="bold" fill="#222222">Чили при Пиночете (1973–1990)</text>
  <text x="994" y="675" font-size="13" fill="#777777">свободный рынок + военная диктатура</text>

  <circle cx="972" cy="711" r="11" fill="#283593"/><text x="972" y="716" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>
  <text x="994" y="708" font-size="15" font-weight="bold" fill="#222222">Тэтчер и Рейган (1980-е)</text>
  <text x="994" y="727" font-size="13" fill="#777777">приватизация, дерегулирование, снижение налогов</text>

  <circle cx="972" cy="763" r="11" fill="#2e7d32"/><text x="972" y="768" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">6</text>
  <text x="994" y="760" font-size="15" font-weight="bold" fill="#222222">«Новый курс» Рузвельта (1933–1939)</text>
  <text x="994" y="779" font-size="13" fill="#777777">социальные программы в рыночной экономике</text>

  <circle cx="972" cy="815" r="11" fill="#2e7d32"/><text x="972" y="820" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">7</text>
  <text x="994" y="812" font-size="15" font-weight="bold" fill="#222222">Швеция XX века («народный дом»)</text>
  <text x="994" y="831" font-size="13" fill="#777777">социал-демократия, государство благосостояния</text>

  <circle cx="972" cy="867" r="11" fill="#2e7d32"/><text x="972" y="872" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">8</text>
  <text x="994" y="864" font-size="15" font-weight="bold" fill="#222222">Революционная Каталония (1936–1939)</text>
  <text x="994" y="883" font-size="13" fill="#777777">анархо-синдикализм, самоуправление коммун</text>

  <circle cx="972" cy="919" r="11" fill="#b8860b"/><text x="972" y="924" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">9</text>
  <text x="994" y="916" font-size="15" font-weight="bold" fill="#222222">Либертарианский идеал (Хайек, Нозик)</text>
  <text x="994" y="935" font-size="13" fill="#777777">минимальное государство, максимум свобод</text>

  <!-- info box -->
  <rect x="950" y="965" width="530" height="145" rx="10" fill="#f4f6fa" stroke="#c9d2e0" stroke-width="1.5"/>
  <text x="972" y="995" font-size="15" font-weight="bold" fill="#1a1a1a">Почему одной шкалы мало?</text>
  <text x="972" y="1022" font-size="13.5" fill="#444444">СССР и Чили Пиночета — противоположности по экономике,</text>
  <text x="972" y="1042" font-size="13.5" fill="#444444">но оба режима — жёсткие диктатуры. Вторая ось (отношение</text>
  <text x="972" y="1062" font-size="13.5" fill="#444444">к власти) отделяет их от демократий с той же экономикой.</text>
  <text x="972" y="1090" font-size="13.5" fill="#8a8a8a">Модель: диаграмма Нолана (1969), «политический компас».</text>

  <!-- ================= Footer ================= -->
  <line x1="120" y1="1168" x2="1480" y2="1168" stroke="#dddddd" stroke-width="1.5"/>
  <text x="120" y="1198" font-size="13.5" fill="#666666">Происхождение терминов: в 1789 г. во французском Учредительном собрании сторонники короля сели справа от председателя, сторонники революции — слева.</text>
  <text x="120" y="1222" font-size="13.5" fill="#666666">Любая схема — упрощение: реальные партии сочетают позиции разных квадрантов, а смысл ярлыков («либерал», «консерватор») зависит от страны и эпохи.</text>
</svg>
