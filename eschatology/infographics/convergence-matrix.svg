    <text transform="rotate(-38 510 158)" x="510" y="158">Ислам</text>
    <text transform="rotate(-38 582 158)" x="582" y="158">Зороастризм</text>
    <text transform="rotate(-38 654 158)" x="654" y="158">Индуизм</text>
    <text transform="rotate(-38 726 158)" x="726" y="158">Буддизм</text>
    <text transform="rotate(-38 798 158)" x="798" y="158">Джайнизм</text>
    <text transform="rotate(-38 870 158)" x="870" y="158">Даосизм</text>
    <text transform="rotate(-38 942 158)" x="942" y="158">Скандинавы</text>
    <text transform="rotate(-38 1014 158)" x="1014" y="158">Коренные</text>
    <text x="1105" y="158" text-anchor="middle" fill="#94a3b8" font-size="12">охват</text>
  </g>

  <!-- row stripes -->
  <g>
    <rect x="36" y="170" width="1128" height="52" rx="8" fill="#ffffff"/>
    <rect x="36" y="222" width="1128" height="52" rx="8" fill="#f1f5f9"/>
    <rect x="36" y="274" width="1128" height="52" rx="8" fill="#ffffff"/>
    <rect x="36" y="326" width="1128" height="52" rx="8" fill="#f1f5f9"/>
    <rect x="36" y="378" width="1128" height="52" rx="8" fill="#ffffff"/>
    <rect x="36" y="430" width="1128" height="52" rx="8" fill="#f1f5f9"/>
    <rect x="36" y="482" width="1128" height="52" rx="8" fill="#ffffff"/>
    <rect x="36" y="534" width="1128" height="52" rx="8" fill="#f1f5f9"/>
  </g>

  <!-- row labels -->
  <g font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end">
    <text x="318" y="201">Моральный упадок перед концом</text>
    <text x="318" y="253">Фигура спасителя</text>
    <text x="318" y="305">Фигура обманщика</text>
    <text x="318" y="357">Финальная битва добра и зла</text>
    <text x="318" y="409">Суд / взвешивание дел</text>
    <text x="318" y="461">Воскресение мёртвых</text>
    <text x="318" y="513">Очищение огнём / катаклизм</text>
    <text x="318" y="565">Новый мир / золотой век</text>
  </g>

  <!-- Row 1 -->
  <g>
