<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="670" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Точки конвергенции эсхатологий</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748b">8 повторяющихся мотивов × 10 традиций</text>

  <defs>
    <g id="sym-full">
      <circle r="9" fill="#4338ca"/>
    </g>
    <g id="sym-half">
      <circle r="9" fill="#ffffff" stroke="#4338ca" stroke-width="1.8"/>
      <path d="M 0 -9 A 9 9 0 0 1 0 9 Z" fill="#4338ca"/>
    </g>
    <g id="sym-empty">
      <circle r="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- column headers (rotated) -->
  <g font-size="13" font-weight="600" fill="#334155">
    <text transform="rotate(-38 366 158)" x="366" y="158">Иудаизм</text>
