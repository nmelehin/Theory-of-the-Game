  <text x="600" y="652" text-anchor="middle" font-size="12" fill="#94a3b8">«Моральный упадок» и «новый мир после конца» — универсальны; «воскресение мёртвых» — почти исключительно иранско-авраамический мотив · инфографика 3 из 3</text>
