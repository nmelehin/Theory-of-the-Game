  <!-- legend -->
  <g font-size="13" fill="#475569">
    <use href="#sym-full" x="330" y="614"/><text x="346" y="619">мотив выражен явно</text>
    <use href="#sym-half" x="530" y="614"/><text x="546" y="619">присутствует частично / косвенно</text>
    <use href="#sym-empty" x="800" y="614"/><text x="816" y="619">отсутствует</text>
