    <use href="#sym-full" x="366" y="560"/><use href="#sym-full" x="438" y="560"/><use href="#sym-full" x="510" y="560"/><use href="#sym-full" x="582" y="560"/><use href="#sym-full" x="654" y="560"/><use href="#sym-full" x="726" y="560"/><use href="#sym-full" x="798" y="560"/><use href="#sym-full" x="870" y="560"/><use href="#sym-full" x="942" y="560"/><use href="#sym-full" x="1014" y="560"/>
